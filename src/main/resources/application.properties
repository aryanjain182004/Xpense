spring.application.name=Xpense
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

xpense.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-key-32}
xpense.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
xpense.frontend-url=${FRONTEND_URL:http://localhost:8081}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.bahikhata.xpense=${LOG_LEVEL_XPENSE:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
