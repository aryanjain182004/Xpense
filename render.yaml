services:
  - type: web
    name: xpense-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_LEVEL_ROOT
        value: INFO
      - key: LOG_LEVEL_XPENSE
        value: INFO
      - key: LOG_LEVEL_SECURITY
        value: WARN
